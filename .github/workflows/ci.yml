name: SanesApp CI

on:
  push:
    branches:
      - develop
      - "feature/**"

  pull_request:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Build and Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: sanesadmin
          POSTGRES_DB: sanesdb_test
          POSTGRES_HOST_AUTH_METHOD: trust

        ports:
          - 55432:5432

        options: >-
          --health-cmd "pg_isready -U sanesadmin -d sanesdb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.400"

      - name: Display .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run web tests
        run: >
          dotnet test
          tests/Sanes.Web.Tests/Sanes.Web.Tests.csproj
          --no-build
          --no-restore
          --configuration Release
          --logger "console;verbosity=normal"

      - name: Run integration tests
        run: >
          dotnet test
          tests/Sanes.Api.IntegrationTests/Sanes.Api.IntegrationTests.csproj
          --no-build
          --no-restore
          --configuration Release
          --logger "console;verbosity=normal"